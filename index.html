const TZ='Europe/Paris';
function isoLocal(date=new Date()) {const v=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(date);return v;}
function parseDate(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function monday(s){const d=parseDate(s);return addDays(s,-((d.getDay()+6)%7));}
function dateDifference(a,b){return Math.round((parseDate(a)-parseDate(b))/86400000);}
function weekIndex(date,start){return Math.floor(dateDifference(monday(date),monday(start))/7)+1;}
function isInsideProgram(date,start){const w=weekIndex(date,start);return w>=1&&w<=12;}
function dayKind(s){return ['match','recovery','football','A','football','B','rest'][parseDate(s).getDay()];}
function effectivePhase(week){if(week<=2)return 'technique';if(week<=4)return 'installation';if(week<=8)return 'progression';if(week===9)return 'deload';return 'consolidation';}
function defaultSettings(){return {programStart:'2026-11-16',semester6:'2027-02-01',startHour:'18:15',homeCourse:'17:30',homeWork:'17:30',footballTue:'',footballThu:'',matchSun:'',notificationTime:'17:45',reminders:true,mode:'auto',theme:'light',pushToken:'',weeklySoreness:0};}
function defaultState(){return {version:1,settings:defaultSettings(),courses:[],weeks:{'2026-11-09':'university'},logs:{},progress:{},overrides:{},makeups:{},measurements:[],checkins:{},notifyQueue:[],notificationLog:{}};}
function classifyDay(date,settings,courses,weeks={}){if([0,6].includes(parseDate(date).getDay()))return 'Week-end';const hits=courses.filter(c=>date===c.date);if(hits.length)return 'IUT';const explicit=weeks?.[monday(date)];if(explicit==='university')return 'IUT';if(explicit==='enterprise')return 'Entreprise';if(date>=settings.semester6)return 'Entreprise (S6 probable)';return settings.mode==='enterprise'?'Entreprise':settings.mode==='university'?'IUT':'À confirmer';}
function dayEvents(date,state){const k=dayKind(date);const matches=(state.overrides||{})[date]||{};if(state.makeups?.[date]){const m=state.makeups[date];return {kind:m.kind,title:'Rattrapage léger · séance '+m.kind,note:'Option choisie : 2 séries maximum par exercice'};}if(matches.cancelled)return {kind:'rest',title:'Séance de foot annulée',note:'Activité annulée par toi'};
 const labels={A:'Force & impulsion',B:'Haut du corps',football:'Entraînement gardien',match:'Match de football',recovery:'Récupération',rest:'Repos'};
 return {kind:k,title:labels[k],note:k==='football'?'40 min intense':k==='match'?'Horaire à définir':k==='A'?'Environ 40 minutes':k==='B'?'Environ 30 minutes':'Priorité au repos'};
}
function slotFor(date,state){
 const kind=dayEvents(date,state).kind;
 if(!['A','B'].includes(kind))return null;
 const preferred=state.settings.startHour||'18:15';
 const sorted=[preferred,'18:15','18:30','19:00','19:30','20:00'].filter((v,i,a)=>a.indexOf(v)===i);
 const events=state.courses.filter(c=>c.date===date);
 const mode=classifyDay(date,state.settings,state.courses,state.weeks);
 let latestCours=events.reduce((v,e)=>Math.max(v,timeMins(e.end)),0);
 const home=mode==='IUT'?state.settings.homeCourse||'17:30':state.settings.homeWork||'17:30';
 // 35 minutes after reaching home, and 45 minutes after the final class if it ends late.
 const earliest=Math.max(timeMins(home)+35,latestCours?latestCours+45:0,1080);
 const duration=kind==='A'?45:35;
 for(const time of sorted){const start=timeMins(time);if(start<earliest||start+duration>1260)continue;return time;}
 return null;
}
function timeMins(v){if(!v)return 0;const [h,m]=v.split(':').map(Number);return h*60+(m||0);}
function plannedPrescription(id,week,progress={},checkin={}){const x=EXERCISES[id];const phase=effectivePhase(week);let sets=phase==='technique'?Math.min(2,x.sets):phase==='installation'?Math.min(2,x.sets):phase==='deload'?Math.max(1,x.sets-1):x.sets;
 sets=Math.max(1,Math.min(x.sets,sets+(progress.setsAdj||0)));
 let reps=progress.reps??x.min;let load=progress.load??0;let variant=progress.variant??0;
 if(checkin.sleep!==undefined&&Number(checkin.sleep)<6)sets=Math.max(1,sets-1);
 if(checkin.soreness>=2)sets=Math.max(1,sets-1);
 // A pain flag freezes progression, but the user may still log non-painful exercises.
 return {sets,setsAdj:progress.setsAdj||0,reps:Math.min(x.max,Math.max(x.min,reps)),load,variant,unit:x.unit,max:x.max,min:x.min};}
function evolveExercise(id,prescription,series,difficulty,pain){const x=EXERCISES[id],actual=series.filter(s=>Number(s.reps)>0),base={reps:prescription.reps,load:prescription.load,variant:prescription.variant||0,setsAdj:prescription.setsAdj||0};
 if(!actual.length)return {...base,reason:'Exercice non réalisé : réglage inchangé.'};
 if(pain)return {...base,reason:'Douleur signalée : aucune hausse automatique. Suspendre l’exercice douloureux.'};
 const minDone=Math.min(...actual.map(s=>Number(s.reps))),allDone=actual.length>=prescription.sets&&minDone>=prescription.reps;
 if(difficulty==='veryhard')return {...base,reps:Math.max(x.min,base.reps-1),setsAdj:Math.max(-2,base.setsAdj-1),reason:'Très difficile : moins de séries et répétitions la prochaine fois.'};
 if(difficulty==='hard'&&!allDone)return {...base,reps:Math.max(x.min,base.reps-1),setsAdj:Math.max(-2,base.setsAdj-1),reason:'Répétitions insuffisantes : cible et volume légèrement allégés.'};
 if((difficulty==='easy'||difficulty==='normal')&&allDone){if(base.setsAdj<0)return {...base,setsAdj:base.setsAdj+1,reason:'Bonne récupération : on restaure d’abord une série.'};if(base.reps<x.max)return {...base,reps:base.reps+1,reason:'Objectif atteint : +1 répétition à viser.'};
   if(x.weight&&Number(base.load)>0)return {...base,reps:x.min,load:Math.round((Number(base.load)+Math.max(0.5,Math.min(2,base.load*.05)))*2)/2,reason:'Haut de fourchette atteint : petit ajout de charge, si le sac le permet.'};
   if(x.kind==='power')return {...base,reason:'Impulsion : la qualité prime, volume conservé.'};
   if(x.kind==='mobility'||x.kind==='time')return {...base,reason:'Amplitude et stabilité d’abord, volume conservé.'};
   return {...base,reps:x.min,variant:base.variant+1,reason:'Haut de fourchette atteint : variante légèrement plus exigeante (contrôle nécessaire).'};
 }
 return {...base,reason:'Progression conservée pour stabiliser la technique.'};
}
function workoutCanBeMoved(from,to,state){if(dateDifference(to,from)<=0||dateDifference(to,from)>7)return false;
 const kind=dayKind(from), target=dayKind(to);if(state.makeups?.[to])return false;if(!['A','B'].includes(kind))return false;
 if(['football','match','A','B'].includes(target)&&!(state.overrides[to]||{}).cancelled)return false;
 for(let j=-1;j<=1;j++){const d=addDays(to,j),e=dayEvents(d,state);if(e.kind==='match')return false;}
 if(kind==='A')for(let j=-1;j<=1;j++){const d=addDays(to,j);if(dayEvents(d,state).kind==='football')return false;}
 return !!slotForMakeup(to,state);
}
function slotForMakeup(date,state){const hits=state.courses.filter(x=>x.date===date);if(hits.some(x=>timeMins(x.end)>=1200))return null;const last=hits.reduce((v,e)=>Math.max(v,timeMins(e.end)),0);const mode=classifyDay(date,state.settings,state.courses,state.weeks);const home=mode==='IUT'?state.settings.homeCourse||'17:30':state.settings.homeWork||'17:30';const earliest=Math.max(timeMins(home)+35,last+45,1080);return ['18:15','18:30','19:00','19:30'].find(t=>timeMins(t)>=earliest)||null;}
function makeupAdvice(date,state){const kind=dayKind(date);if(!['A','B'].includes(kind))return {date:null,reason:'Pas de rattrapage nécessaire.'};
 for(let i=1;i<=7;i++){const candidate=addDays(date,i);if(workoutCanBeMoved(date,candidate,state))return {date:candidate,reason:'Créneau possible, uniquement si tu es bien récupéré ; séance allégée à 2 séries.'};}
 return {date:null,reason:'Aucun créneau sûr avant les prochaines séances de football. Ne compense pas avec une double séance ; reprends le programme normalement.'};
}
function planNotifications(state,today=isoLocal()){const records=[];for(let i=0;i<21;i++){let date=addDays(today,i);const e=dayEvents(date,state);if(['A','B','football','match'].includes(e.kind)&&!state.logs[date]?.status){const when=['A','B'].includes(e.kind)?slotFor(date,state):(e.kind==='football'?(parseDate(date).getDay()===2?state.settings.footballTue:state.settings.footballThu):state.settings.matchSun);
  if(!when)continue;const at=new Date(`${date}T${when}:00`);at.setMinutes(at.getMinutes()-30);records.push({id:`${date}-${e.kind}`,at:at.toISOString(),title:e.kind==='match'?'Match aujourd’hui !':e.kind==='football'?'Entraînement gardien':'Séance programmée',body:e.title+' · '+when,href:'#today'});}}
 return records;
}


const WD=['SU','MO','TU','WE','TH','FR','SA'];
function val(src,key){const line=src.find(s=>s.split(':')[0].split(';')[0]===key);return line?line.slice(line.indexOf(':')+1):'';}
function decode(x){return x.replace(/\\n/gi,' · ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');}
function parseICSDate(value){let v=value.replace(/[^0-9TZ]/g,'');if(v.length<8)return null;
 const year=v.slice(0,4),month=v.slice(4,6),day=v.slice(6,8),h=v.slice(9,11)||'00',m=v.slice(11,13)||'00';
 if(v.endsWith('Z')){let d=new Date(`${year}-${month}-${day}T${h}:${m}:00Z`);const p=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Paris',dateStyle:'short',timeStyle:'short',hour12:false}).format(d).replace(',','');let match=p.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);if(match)return {date:match[1],time:match[2]};}
 return {date:`${year}-${month}-${day}`,time:`${h}:${m}`};}
function parseICS(text,{min='2026-11-01',max='2027-12-31'}={}){if(!/BEGIN:VCALENDAR/.test(text))throw Error('Ce fichier ne ressemble pas à un calendrier .ics');
 const unfolded=text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('\n').map(x=>x.trim());const events=[];let buffer=null;
 for(const line of unfolded){if(line==='BEGIN:VEVENT'){buffer=[];continue;}if(line==='END:VEVENT'){if(buffer)events.push(buffer);buffer=null;continue;}if(buffer)buffer.push(line);}
 const result=[];const seen=new Set();const inRange=(s)=>s>=min&&s<=max;
 for(const lines of events){const start=parseICSDate(val(lines,'DTSTART')),end=parseICSDate(val(lines,'DTEND'));if(!start)continue;
 const title=decode(val(lines,'SUMMARY')||'Cours IUT'),loc=decode(val(lines,'LOCATION')||'');const uid=val(lines,'UID')||`${title}-${start.date}-${start.time}`;
 const duration=((Number((end||start).time.slice(0,2))*60+Number((end||start).time.slice(3,5)))-(Number(start.time.slice(0,2))*60+Number(start.time.slice(3,5))))||90;
 const endTime=(date)=>{let total=Number(start.time.slice(0,2))*60+Number(start.time.slice(3,5))+Math.max(1,duration);return `${String(Math.min(23,Math.floor(total/60))).padStart(2,'0')}:${String(Math.min(59,total%60)).padStart(2,'0')}`;};
 const except=new Set(val(lines,'EXDATE').split(',').filter(Boolean).map(x=>parseICSDate(x)?.date));
 const push=(date)=>{if(!inRange(date)||except.has(date))return;const key=uid+'-'+date;if(seen.has(key))return;seen.add(key);result.push({id:key,date,start:start.time,end:endTime(date),title,location:loc});};
 const rule=val(lines,'RRULE');if(!rule){push(start.date);continue;}
 const p=Object.fromEntries(rule.split(';').map(x=>x.split('=')));const interval=Math.max(1,Number(p.INTERVAL)||1);const until=p.UNTIL?parseICSDate(p.UNTIL)?.date:max;const count=Number(p.COUNT)||10000;let generated=0;
 if(p.FREQ==='WEEKLY'||p.FREQ==='DAILY'){
 const days=p.BYDAY?.split(',')||[WD[new Date(start.date+'T12:00:00').getDay()]];
 for(let i=0;i<700&&generated<count;i++){const date=addDays(start.date,i);if(date>max||date>until)break;const wd=WD[new Date(date+'T12:00:00').getDay()];const cycles=Math.floor(i/7);
 const valid=p.FREQ==='DAILY'?i%interval===0:(cycles%interval===0&&days.includes(wd));if(valid){push(date);generated++;}}
 }else push(start.date);
 }
 return result.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));}
function exportICS(state,start,countDays=84){
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Goalkeeper OS//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:Goalkeeper OS'];
 for(let i=0;i<countDays;i++){
  const date=addDays(start,i),day=new Date(date+'T12:00:00').getDay();
  const kind=dayKind(date);
  if(!['A','B','football','match'].includes(kind)||state.logs[date]?.status==='done'||state.logs[date]?.status==='missed')continue;
  const startTime=kind==='A'||kind==='B'?slotFor(date,state):kind==='football'?(day===2?state.settings.footballTue:state.settings.footballThu):state.settings.matchSun;
  if(!startTime)continue;
  const title=kind==='A'?'Renforcement A · force et impulsion':kind==='B'?'Renforcement B · haut du corps':kind==='football'?'Entraînement gardien':'Match de football';
  const total=Number(startTime.slice(0,2))*60+Number(startTime.slice(3,5))+(kind==='A'?45:kind==='B'?35:kind==='football'?40:120);
  const endTime=String(Math.floor(total/60)).padStart(2,'0')+String(total%60).padStart(2,'0');
  const d=date.replace(/-/g,'');
  lines.push('BEGIN:VEVENT',`UID:goalkeeper-${date}-${kind}@goalkeeper-os`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;TZID=Europe/Paris:${d}T${startTime.replace(':','')}00`,`DTEND;TZID=Europe/Paris:${d}T${endTime}00`,`SUMMARY:${title}`,'DESCRIPTION:Goalkeeper OS : adapter la charge à la récupération.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Rappel sportif Goalkeeper OS','TRIGGER:-PT30M','END:VALARM','END:VEVENT');
 }
 lines.push('END:VCALENDAR');return lines.join('\r\n');
}

function planningView(){const now=isoLocal(),selectedEvent=dayEvents(selected,state),courses=state.courses.filter(e=>e.date===selected),mode=classifyDay(selected,state.settings,state.courses,state.weeks),session=state.logs[selected];const wd=new Date(selected+'T12:00:00').getDay();const dateCourseCount=new Set(state.courses.map(x=>x.date)).size;let noFootTime=selectedEvent.kind==='football'?(wd===2?!state.settings.footballTue:!state.settings.footballThu):selectedEvent.kind==='match'&&!state.settings.matchSun;

function trainingView(){if(activeSession)return sessionView();if(detail)return detailView(detail);const now=isoLocal(),wi=Math.max(1,weekIndex(now,state.settings.programStart));return `<div class="subheader"><div><h1>Ton plan de renforcement</h1><p class="muted small">Deux séances complémentaires aux entraînements gardien et au match</p></div><span class="badge purple">Semaine ${wi}</span></div><div class="banner green">${icon('check')}<div><strong>Principe de progression</strong><p>La difficulté ressentie et les répétitions réellement réalisées pilotent la séance suivante. Douleur = aucune augmentation automatique.</p></div></div>${Object.entries(WORKOUTS).map(([key,w])=>{const nearest=Array.from({length:14},(_,i)=>addDays(now,i)).find(d=>d>=state.settings.programStart&&dayKind(d)===key)||now;return `<section class="section"><div class="card"><div class="row"><div><span class="badge ${key==='A'?'purple':'green'}">${key==='A'?'Mercredi':'Vendredi'} · ${w.mins} min</span><h2 style="margin-top:9px">${esc(w.name)}</h2><p class="small muted">${esc(w.focus)}</p></div></div><div class="divider"></div>${w.exercises.map((id,i)=>exerciseCard(id,i,wi,true)).join('')}<div style="margin-top:13px"><button class="btn ${key==='A'?'':'soft'} full" data-action="start" data-kind="${key}" data-date="${nearest}">${icon('play')} ${key==='A'?'Commencer A':'Commencer B'}</button></div></div></section>`}).join('')}<section class="section"><div class="card"><h3>Échauffement (5–7 min)</h3><p class="small muted">Marche active, mobilisation des chevilles et des épaules, flexions de jambes faciles et mouvements progressifs. Commence les bonds uniquement si tu es bien récupéré et disposes d’un sol dégagé.</p></div></section>`}
function detailView(id){const x=EXERCISES[id];if(!x){detail=null;return trainingView()}const vid=x.video.match(/(?:youtu\.be\/|watch\?v=)([\w-]{11})/);return `<div class="row"><button class="btn ghost small" data-action="back-detail">‹ Retour aux séances</button><span class="badge purple">${esc(x.category)}</span></div><section class="section"><h1>${esc(x.name)}</h1><p class="muted">${esc(x.muscle)}</p><div class="card"><div class="row"><strong>Démonstration</strong><span class="tiny muted">Source externe</span></div>${vid?`<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:12px" loading="lazy" title="Tutoriel vidéo ${esc(x.name)}" src="https://www.youtube-nocookie.com/embed/${vid[1]}" allow="accelerometer;encrypted-media;gyroscope;picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`:`<a class="thumb-play" href="${esc(x.video)}" target="_blank" rel="noopener noreferrer">${icon('play')} Voir la démonstration vidéo</a>`}<a href="${esc(x.video)}" target="_blank" rel="noopener noreferrer" class="switchlink">Ouvrir la vidéo dans un nouvel onglet ↗</a><div class="divider"></div><h3>Exécution pas à pas</h3><ol class="tip-list">${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="banner green">${icon('check')}<div><strong>Conseil du coach</strong><p>${esc(x.tips)}</p></div></div><div class="banner amber">${icon('info')}<div><strong>À éviter</strong><p>${esc(x.avoid)}</p></div></div></div></section>`}
function sessionView(){const {date,kind}=activeSession,w=WORKOUTS[kind],isMakeup=!!state.makeups?.[date],wi=Math.max(1,weekIndex(date,state.settings.programStart)),old=state.logs[date]||{},pres=state.checkins[date]||{};return `<div class="row"><button class="btn ghost small" data-action="stop-session">‹ Retour</button><span class="badge purple">Semaine ${wi} · séance ${kind}</span></div><section class="section"><h1>${esc(w.name)}</h1><p class="muted small">${esc(dateLabel(date))} · ${isMakeup?'Rattrapage allégé : maximum 2 séries par exercice.':w.mins+' minutes prévues.'} Note tes répétitions réellement faites.</p><form id="session-form" class="session-form"><div class="card"><h3>Ton état avant la séance</h3><div class="form-row"><div class="field"><label for="sleep">Sommeil (heures)</label><input id="sleep" name="sleep" type="number" min="0" max="14" step="0.5" placeholder="ex. 7" value="${esc(pres.sleep??'')}"></div><div class="field"><label for="soreness">Courbatures / fatigue</label><select id="soreness" name="soreness"><option value="0">Faible</option><option value="1" ${pres.soreness===1?'selected':''}>Modérée</option><option value="2" ${pres.soreness===2?'selected':''}>Forte</option><option value="3" ${pres.soreness===3?'selected':''}>Très forte</option></select></div></div><label class="checkrow"><input type="checkbox" name="pain" id="pain" ${pres.pain?'checked':''}> Douleur inhabituelle pendant les mouvements</label><p class="footer-note">Si tu es blessé ou ressens une douleur anormale, arrête l’exercice concerné.</p></div><section class="section"><div class="card"><h3>Exercices et séries</h3><p class="small muted">Laisse vide une série non réalisée. Saisis « 0 » uniquement si tu ne l’as pas faite.</p>${w.exercises.map((id,ix)=>{const x=EXERCISES[id],p=plannedPrescription(id,wi,state.progress[id],pres),oldSeries=old.series?.[id]||[];if(isMakeup)p.sets=Math.min(2,p.sets);return `<div class="exercise"><div class="exercise-top"><span class="exercise-icon">${ix function progressView(){const entries=Object.values(state.logs).sort((a,b)=>b.date.localeCompare(a.date)),done=entries.filter(x=>x.status==='done'&&['A','B'].includes(x.kind)),miss=entries.filter(x=>x.status==='missed'),now=isoLocal();const chartData=Array.from({length:8},(_,i)=>{const wk=addDays(monday(now),-7*(7-i)),end=addDays(wk,6);return {label:'S'+(8-i),count:done.filter(x=>x.date>=wk&&x.date<=end).length}});const max=Math.max(2,...chartData.map(d=>d.count));return `<div class="subheader"><div><h1>Ton évolution</h1><p class="muted small">Ta progression vient des séances réellement effectuées</p></div><span class="badge purple">12 semaines & au-delà</span></div><div class="grid3"><div class="card metric"><div class="caps">Terminées</div><div class="big mono">${done.length}</div><div class="desc">Renforcement</div></div><div class="card metric"><div class="caps">Manquées</div><div class="big mono">${miss.length}</div><div class="desc">Sans culpabilité</div></div><div class="card metric"><div class="caps">Adhérence</div><div class="big mono">${done.length+miss.length?Math.round(done.length/(done.length+miss.length)*100):'—'}${done.length+miss.length?'%':''}</div><div class="desc">Séances déclarées</div></div></div><section class="section"><div class="card"><h3>Fréquence de renforcement</h3><p class="small muted">Séances terminées sur les huit dernières semaines.</p><div class="bars">${chartData.map(p=>`<div class="barcol"><div class="bar" title="${p.count} séances" style="height:${Math.max(2,p.count/max*100)}%"></div><small>${p.label}</small></div>`).join('')}</div><p class="tiny muted">Objectif initial : 1 à 2 séances de renforcement par semaine, selon la récupération.</p></div></section><section class="section"><div class="card"><div class="section-head"><h2>Derniers entraînements</h2></div>${entries.length?entries.slice(0,8).map(x=>`<div class="log-entry"><div class="row"><strong>${esc(dateLabel(x.date,{weekday:'short',day:'numeric',month:'short'}))} · ${esc(x function settingsView(){const s=state.settings;return `<div class="subheader"><div><h1>Les réglages du coach</h1><p class="muted small">Agenda, rappels, sauvegarde et rythme de vie</p></div></div><div class="stack"><div class="card"><div class="row"><h2>Semaines IUT / entreprise</h2><span class="badge purple">Sans export Satelis</span></div><p class="small muted">Satelis refuse l’export VCal. Tu peux marquer chaque semaine d’un geste. Seule celle du 9 novembre 2026 est confirmée par ta capture ; le semestre 6 est supposé majoritairement en entreprise, à vérifier.</p><div class="form-row"><div class="field"><label for="week-mark-date">Une date de la semaine</label><input type="date" id="week-mark-date" value="${isoLocal()}"></div><div class="field"><label for="week-mark-type">Type</label><select id="week-mark-type"><option value="university">Semaine IUT</option><option value="enterprise">Semaine entreprise</option><option value="unknown">Non confirmée</option></select></div></div><button class="btn soft full" data-action="mark-week">Enregistrer la semaine</button><p class="footer-note">Dans Planning, les boutons IUT / Entreprise / ? permettent aussi de marquer la semaine affichée.</p><div class="week-list">${Object.entries(state.weeks||{}).sort((a,b)=>a[0].localeCompare(b[0])).map(([w,kind])=>`<div class="row week-entry"><span class="small"><strong>${esc(dateLabel(w,{day:'numeric',month:'long',year:'numeric'}))}</strong> · ${kind==='university'?'IUT':'Entreprise'}</span><button class="small-link" data-action="unmark-week" data-date="${w}">Retirer</button></div>`).join('')||'<p class="small muted">Aucune semaine confirmée.</p>'}</div></div><div class="card"><div class="row"><h2>Satelis / IUT</h2><span class="badge ${state.courses.length?'green':'amber'}">${state.courses.length} cours</span></div><p class="small muted">L’accès direct au navigateur Satelis n’est pas disponible ici. L’export VCal est bloqué sur ton compte. En alternative, marque tes semaines ci-dessus et ajoute les horaires importants manuellement. Si tu obtiens plus tard un <strong>.ics</strong>, tu pourras aussi l’importer. Le calendrier reste sur cet appareil.</p><label class="btn soft full" for="ics-file" style="cursor:pointer">${icon('upload')} Importer un fichier .ics</label><input id="ics-file" type="file" accept=".ics,text/calendar" hidden><div class="form-row"><div class="field"><label for="course-date">Jour de cours manuel</label><input type="date" id="course-date" value="${isoLocal()}"></div><div class="field"><label for="course-title">Intitulé</label><input id="course-title" placeholder="Cours IUT" value="Cours IUT"></div></div><div class="form-row"><div class="field"><label>De</label><input type="time" id="course-start" value="08:00"></div><div class="field"><label>À</label><input type="time" id="course-end" value="17:00"></div></div><div class="pills"><button class="btn ghost small" data-action="add-course">Ajouter un cours</button><button class="btn ghost small" data-action="clear-courses">Effacer tous les cours</button></div><p class="footer-note">Import : événements iCalendar et récurrences hebdomadaires usuelles. Après import, vérifie les horaires, les semaines et les cours exceptions dans Planning.</p></div><div class="card"><h2>Ton emploi du temps</h2><div class="form-row"><div class="field"><label>Début du programme</label><input data-setting="programStart" type="date" value="${esc(s.programStart)}"></div><div class="field"><label>Début estimé S6</label><input data-setting="semester6" type="date" value="${esc(s.semester6)}"></div></div><div class="field"><label>Rythme avant S6 quand aucun cours n’est importé</label><select data-setting="mode"><option value="auto" ${s.mode==='auto'?'selected':''}>À confirmer (recommandé)</option><option value="enterprise" ${s.mode==='enterprise'?'selected':''}>Entreprise</option><option value="university" ${s.mode==='university'?'selected':''}>Cours IUT</option></select></div><div class="form-row"><div class="field"><label>Renfo mercredi/vendredi</label><input data-setting="startHour" type="time" value="${esc(s.startHour)}"></div><div class="field"><label>Rappel (indicatif)</label><input data-setting="notificationTime" type="time" value="${esc(s.notificationTime)}"></div></div><div class="form-row"><div class="field"><label>Retour maison après cours (moyenne)</label><input data-setting="homeCourse" type="time" value="${esc(s.homeCourse)}"></div><div class="field"><label>Retour maison après entreprise (estimé)</label><input data-setting="homeWork" type="time" value="${esc(s.homeWork)}"></div></div><div class="form-row"><div class="field"><label>Foot mardi (heure)</label><input data-setting="footballTue" type="time" value="${esc(s.footballTue)}"></div><div class="field"><label>Foot jeudi (heure)</label><input data-setting="footballThu" type="time" value="${esc(s.footballThu)}"></div></div><div class="field"><label>Match dimanche (heure habituelle, si connue)</label><input data-setting="matchSun" type="time" value="${esc(s.matchSun)}"></div><p class="footer-note">En entreprise : 08:30–17:00. Au retour des cours : environ 17:30. Le trajet retour de l’entreprise reste estimé et modifiable. Au semestre 6 : rythme entreprise par défaut, sauf cours importés. Cinq semaines IUT éventuelles, non confirmées.</p><button class="btn soft full" data-action="calendar-export">${icon('download')} Exporter le calendrier avec rappels (.ics)</button></div><div class="card"><h2>Notifications</h2><div class="toggle-row"><div><strong>Rappels de séances</strong><div class="muted small">Notifications et indicateurs dans l’application</div></div><input type="checkbox" data-setting="reminders" ${s.reminders?'checked':''}></div><div class="banner amber">${icon('info')}<div><strong>Important pour les notifications fermées</strong><p>Le bouton d’export calendrier inclut une alarme 30 minutes avant chaque séance : tu peux importer le fichier dans ton agenda de téléphone. Les vraies notifications Web Push lorsque l’app est fermée nécessitent toujours un service serveur. Sans ce serveur, seule l’alerte lorsque tu ouvres l’application est disponible.</p></div></div><div class="field"><label>Clé d’accès privée au serveur (optionnel)</label><input data-setting="pushToken" type="password" value="${esc(s.pushToken)}" autocomplete="off" placeholder="APP_ACCESS_TOKEN"></div><div class="pills"><button class="btn soft small" data-action="notify-enable">${icon('bell')} Activer Web Push</button><button class="btn ghost small" data-action="notify-test">Tester une alerte</button></div><p class="footer-note" id="push-status">Statut : à vérifier. Sur iPhone (iOS 16.4+), ajoute d’abord l’application à l’écran d’accueil.</p></div><div class="card"><h2>Installer sur ton téléphone</h2><p class="small muted">Android/Chrome : menu ⋮ → Installer l’application. iPhone/Safari : Partager → Sur l’écran d’accueil. Il faut un site servi en HTTPS (ou localhost pour les tests).</p><button class="btn soft full" data-action="install">${icon('download')} Installer Goalkeeper OS</button></div><div class="card"><h2>Sauvegarde et confidentialité</h2><p class="small muted">Toutes tes séances et tes cours sont conservés localement sur ce navigateur, sauf activation volontaire des notifications serveur. Si tu effaces les données du site ou changes de téléphone, restaure une sauvegarde.</p><div class="pills"><button class="btn ghost small" data-action="backup">${icon('download')} Exporter JSON</button><label class="btn ghost small" for="restore-file">${icon('upload')} Restaurer JSON</label><input id="restore-file" type="file" accept=".json,application/json" hidden></div></div><div class="card"><h2>Sources et bonnes pratiques</h2><div class="source-list">${SOURCES.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">${esc(x.name)} ↗</a>`).join('')}</div></div></div>`}
function render(){applyTheme();const page={today:todayView,planning:planningView,training:trainingView,progress:progressView,settings:settingsView}[tab]||todayView;$('#app').innerHTML=shell(page());persist();if(tab==='settings')checkPushStatus();}
function start(date,kind){if(!WORKOUTS[kind])return;activeSession={date,kind};detail=null;tab='training';location.hash='training';render();window.scrollTo({top:0,behavior:'instant'})}
function saveSession(form){if(!activeSession)return;const {date,kind}=activeSession,isMakeup=!!state.makeups?.[date],wi=Math.max(1,weekIndex(date,state.settings.programStart)),data=new FormData(form),difficulty=data.get('difficulty')||'normal',pain=data.get('pain')==='on';const sleep=data.get('sleep')===''?undefined:Number(data.get('sleep')),soreness=Number(data.get('soreness')||0);const checkin={sleep,soreness,pain};const series={};let performed=0;let messages=[];
 WORKOUTS[kind].exercises.forEach(id=>{const x=EXERCISES[id],p=plannedPrescription(id,wi,state.progress[id],checkin);if(isMakeup)p.sets=Math.min(2,p.sets);series[id]=Array.from({length:p.sets},(_,i)=>{const reps=data.get(`rep-${id}-${i}`);const load=data.get(`load-${id}-${i}`);return {reps:reps===''?null:Number(reps),load:load==null||load===''?p.load:Number(load)};});const real=series[id].filter(x=>Number(x.reps)>0);if(real.length){performed++;if(x.weight){const valid=real.filter(x=>Number.isFinite(x.load));if(valid.length)p.load=Number(valid[valid.length-1].load);}const next=evolveExercise(id,p,real,difficulty,pain);state.progress[id]={reps:next.reps,load:next.load,variant:next.variant,setsAdj:next.setsAdj};if(next.reason&&messages.length<3)messages.push(`${x.name} : ${next.reason}`);}});
 if(!performed){tell('Note au moins une série réalisée avant d’enregistrer.');return;}
 state.checkins[date]=checkin;const makeupFor=state.makeups?.[date]?.from||null;if(makeupFor)delete state.makeups[date];state.logs[date]={date,kind,makeupFor,status:'done',difficulty,pain,sleep,soreness,series,notes:String(data.get('notes')||''),advice:messages[0]||'',recordedAt:new Date().toISOString()};persist();activeSession=null;tell('Séance enregistrée. Progrès mis à jour !');go('progress');syncPushSchedule();}
function skip(date){const kind=dayEvents(date,state).kind;if(!['A','B'].includes(kind))return;const advice=makeupAdvice(date,state);state.logs[date]={date,kind,status:'missed',makeupDate:advice.date,advice:advice.date?`Rattrapage optionnel le ${dateLabel(advice.date)} : ${advice.reason}`:advice.reason};persist();activeSession=null;go('planning');selected=date;currentMonday=monday(date);render();tell(advice.date?`Rattrapage possible : ${dateLabel(advice.date)}`:'Séance manquée : reprise normale recommandée.');syncPushSchedule();}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function handleAction(node){const action=node.dataset.action,dt=node.dataset.date,id=node.dataset.id;if(action==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';render();}
 if(action==='week-prev'){currentMonday=addDays(currentMonday,-7);selected=currentMonday;render()}
 if(action==='week-next'){currentMonday=addDays(currentMonday,7);selected=currentMonday;render()}
 if(action==='week-today'){currentMonday=monday(isoLocal());selected=isoLocal();render()}
 if(action==='select-day'){selected=dt;currentMonday=monday(dt);go('planning')}
 if(action==='start')start(dt,node.dataset.kind);
 if(action==='stop-session'){activeSession=null;render()}
 if(action==='detail'){detail=id;render();window.scrollTo(0,0)}
 if(action==='back-detail'){detail=null;render()}
 if(action==='detail-session'){let x=EXERCISES[id];window.open(x.video,'_blank','noopener,noreferrer');}
 if(action==='skip'){if(confirm('Marquer cette séance comme manquée ? Le coach cherchera un créneau sûr, sans forcer le rattrapage.'))skip(dt);}
 if(action==='record-foot'){const kind=dayKind(dt);if(state.logs[dt]?.status==='done'){delete state.logs[dt]}else{state.logs[dt]={date:dt,kind,status:'done',recordedAt:new Date().toISOString()}}persist();render();}
 if(action==='cancel-foot'){state.overrides[dt]={cancelled:!state.overrides[dt]?.cancelled};persist();render()}
 if(action==='week-iut'||action==='week-enterprise'||action==='week-unknown'||action==='mark-week'){const chosenDate=action==='mark-week'?$('#week-mark-date')?.value:currentMonday;const chosen=action==='mark-week'?$('#week-mark-type')?.value:action==='week-iut'?'university':action==='week-enterprise'?'enterprise':'unknown';if(!chosenDate){tell('Choisis une date.');return;}const week=monday(chosenDate);state.weeks=state.weeks||{};if(chosen==='unknown')delete state.weeks[week];else state.weeks[week]=chosen;persist();render();tell('Semaine actualisée : '+(chosen==='unknown'?'non confirmée':chosen==='university'?'IUT':'entreprise')+'.');}
 if(action==='unmark-week'){state.weeks=state.weeks||{};delete state.weeks[monday(dt)];persist();render();tell('Semaine remise à confirmer.');}
 if(action==='add-course'){const date=$('#course-date').value,title=$('#course-title').value.trim(),start=$('#course-start').value,end=$('#course-end').value;if(!date||!title||!start||!end||start>=end){tell('Renseigne un cours avec des horaires valides.');return;}state.courses.push({id:`manual-${Date.now()}`,date,title,start,end,location:''});state.courses.sort((a,b)=>a.date.localeCompare(b.date));persist();tell('Cours ajouté !');render();}
 if(action==='clear-courses'){if(confirm('Supprimer tous les cours importés et ajoutés ?')){state.courses=[];persist();render();}}
 if(action==='calendar-export'){download('goalkeeper-entraînements.ics',exportICS(state,isoLocal(),84),'text/calendar;charset=utf-8');tell('Planning .ics exporté.');}
 if(action==='backup'){download('goalkeeper-os-sauvegarde.json',JSON.stringify(state,null,2),'application/json');tell('Sauvegarde téléchargée.');}
 if(action==='schedule-makeup'){const log=state.logs[dt];if(!log?.makeupDate){tell('Pas de rattrapage sûr proposé.');return;}if(!makeupAdvice(dt,state).date){tell('Le créneau n’est plus disponible ou sûr : poursuis normalement.');return;}state.makeups[log.makeupDate]={kind:log.kind,from:dt};persist();selected=log.makeupDate;currentMonday=monday(selected);go('planning');tell('Rattrapage allégé ajouté à ton calendrier.');}
 if(action==='save-measure'){let d=$('#metric-date').value,w=$('#metric-weight').value,n=$('#metric-note').value.trim();if(!d||(!w&&!n)){tell('Saisis au moins le poids ou une note.');return;}state.measurements.push({date:d,weight:w?Number(w):null,note:n});persist();render();tell('Bilan enregistré.');}
 if(action==='install')installApp();
 if(action==='notify-enable')enableNotifications();
 if(action==='notify-test')testNotification();}
$('#app').addEventListener('click',event=>{const navEl=event.target.closest('[data-tab]');if(navEl){go(navEl.dataset.tab);return;}const action=event.target.closest('[data-action]');if(action){event.preventDefault();handleAction(action);}});
$('#app').addEventListener('submit',event=>{if(event.target.id==='session-form'){event.preventDefault();saveSession(event.target);}});
$('#app').addEventListener('change',async event=>{const el=event.target;if(el.dataset.setting){state.settings[el.dataset.setting]=el.type==='checkbox'?el.checked:el.value;persist();if(el.dataset.setting!=='pushToken')syncPushSchedule();return;}
 if(el.id==='ics-file'&&el.files?.[0]){try{const txt=await el.files[0].text();const imported=parseICS(txt);if(!imported.length){tell('Aucun cours trouvé entre novembre 2026 et décembre 2027.');return;}const base=state.courses.filter(x=>!x.id.startsWith('ics-'));const merged=[...base,...imported.map(x=>({...x,id:'ics-'+x.id}))];const ids=new Map(merged.map(x=>[x.id,x]));state.courses=[...ids.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));persist();render();tell(`${imported.length} événements importés. Vérifie le planning.`);}catch(e){tell('Import impossible : '+e.message);}}
 if(el.id==='restore-file'&&el.files?.[0]){try{const data=JSON.parse(await el.files[0].text());if(data.version!==1||!data.settings||!data.logs)throw Error('Format de sauvegarde incompatible');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){localStorage.setItem(KEY,JSON.stringify(data));state=load();render();tell('Sauvegarde restaurée.')}}catch(e){tell('Fichier non valide : '+e.message);}}
});
window.addEventListener('hashchange',()=>{const next=(location.hash.slice(1)||'today').split('?')[0];if(next!==tab){tab=next;activeSession=null;detail=null;render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
async function installApp(){if(installPrompt){await installPrompt.prompt();installPrompt=null;return;}tell('Sur téléphone : menu navigateur → Ajouter à l’écran d’accueil (HTTPS requis).');}
async function testNotification(){if(!('Notification' in window)||!('serviceWorker' in navigator)){tell('Notifications non prises en charge sur ce navigateur.');return;}try{const perm=await Notification.requestPermission();if(perm!=='granted'){tell('Autorisation de notification non accordée.');return;}const reg=await navigator.serviceWorker.ready;await reg.showNotification('Goalkeeper OS',{body:'Test réussi ! Ton rappel fonctionne pendant que le site est actif.',icon:'./assets/icon.svg',tag:'goalkeeper-test'});tell('Notification de test envoyée.');}catch(e){tell('Test impossible : '+e.message);}}
function decodeKey(base64){const b64=base64.replace(/-/g,'+').replace(/_/g,'/');const pad='='.repeat((4-b64.length%4)%4);const data=atob(b64+pad);return Uint8Array.from(data,c=>c.charCodeAt(0));}
async function api(path,body){const token=state.settings.pushToken;const resp=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});if(!resp.ok)throw Error('Serveur '+resp.status);return resp.json();}
async function enableNotifications(){if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){tell('Web Push indisponible sur cet appareil/navigateur.');return;}if(!state.settings.pushToken){tell('Renseigne d’abord ta clé d’accès au serveur.');return;}try{const perm=await Notification.requestPermission();if(perm!=='granted'){tell('Autorisation non accordée.');return;}const c=await fetch('/api/config');if(!c.ok)throw Error('Serveur push non configuré');const cfg=await c.json();if(!cfg.publicKey)throw Error('Clés VAPID manquantes');const reg=await navigator.serviceWorker.ready;const subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:decodeKey(cfg.publicKey)});const id=localStorage.getItem('goalkeeper-device-id')||('gk-'+crypto.randomUUID());localStorage.setItem('goalkeeper-device-id',id);await api('/api/subscribe',{deviceId:id,subscription});await syncPushSchedule();tell('Web Push activé sur cet appareil.');checkPushStatus();}catch(e){tell('Activation impossible : '+e.message)}}
async function syncPushSchedule(){if(!state.settings.pushToken||!('serviceWorker' in navigator))return;try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(!sub)return;const id=localStorage.getItem('goalkeeper-device-id');if(!id)return;await api('/api/schedule',{deviceId:id,events:state.settings.reminders?planNotifications(state):[]});}catch{}}
async function checkPushStatus(){const out=$('#push-status');if(!out)return;const permission=('Notification'in window)?Notification.permission:'non disponible';let backend=false;try{const r=await fetch('/api/config');backend=r.ok&&!!(await r.json()).publicKey}catch{}if(document.contains(out))out.textContent=`Permission : ${permission} · serveur Web Push : ${backend?'disponible':'non connecté'}. Les alertes lorsque l’app est fermée exigent un serveur actif.`;}
async function openReminder(){if(!state.settings.reminders)return;const now=isoLocal(),e=dayEvents(now,state),kind=e.kind;if(!['A','B'].includes(kind)||state.logs[now]?.status)return;const slot=slotFor(now,state),stamp=now+'-'+kind;if(!slot)return;const current=new Date(),target=new Date(`${now}T${slot}:00`);const minutes=(target-current)/60000;if(minutes<=30&&minutes>=-90&&state.notificationLog[stamp]!==true){state.notificationLog[stamp]=true;persist();tell(`Rappel : ${e.title} aujourd’hui à ${slot}`);if(Notification.permission==='granted'&&'serviceWorker'in navigator){try{const r=await navigator.serviceWorker.ready;await r.showNotification('Goalkeeper OS',{body:`${e.title} · ${slot}`,icon:'./assets/icon.svg',tag:stamp})}catch{}}}}
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();if('serviceWorker' in navigator)syncPushSchedule();if('Notification' in window)openReminder();
</script></body></html>
